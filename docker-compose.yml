services:
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "6001:6001"
    depends_on:
      - redis
      - external-ledger
    environment:
      SERVER_PORT: 6001
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SYSTEM_B_WS_URL: ws://external-ledger:6002/mock-ws
      SIGNATURE_VERIFICATION_ENABLED: "true"
      SIGNATURE_PUBLIC_KEY_PATH: "classpath:keys/public.pem"
    volumes:
      - ./keys/public.pem:/app/keys/public.pem

  external-ledger:
    build: ../external.ledger
    container_name: external-ledger
    ports:
      - "6002:6002"
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"